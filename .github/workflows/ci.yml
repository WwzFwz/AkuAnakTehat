name: foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: false
      - name: Test independent service modules and bootstrap
        run: sh scripts/check/check.sh
      - name: Test safe demo output and redirect handling
        run: python3 -m unittest discover -s scripts/demo -p test_demo.py -v
      - name: Check Compose configuration
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
          sh scripts/secrets/generate.sh
          docker compose config --quiet
      - name: Start foundation stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Test HTTP contracts, refresh rotation, and persistence
        env:
          GOTELEMETRY: 'off'
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: go test ./scripts/check/foundation_test.go -v -count=1 -timeout=8m
      - name: Test ingest transactions against PostgreSQL
        run: docker compose run --build --rm --env-from-file ./env/aggregator.env ingest-test
      - name: Test live ingest, drift, and source outage isolation
        env:
          GOTELEMETRY: 'off'
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: go test ./scripts/check/foundation_test.go ./scripts/check/ingest_test.go -run TestIngestPipeline -v -count=1 -timeout=5m
      - name: Test Kafka delivery, SQLite replay, DLQ, and recovery
        env:
          GOTELEMETRY: 'off'
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: make events-check
      - name: Test query integration, natural token expiry, and independent rebuild
        run: make query-check
      - name: Measure concurrent reads, sustained connections, and outage recovery
        run: make load-check
      - name: Inspect service state
        if: always()
        run: docker compose ps -a
      - name: Preserve load test measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: docs/evidence/integration/load/
      - name: Stop foundation stack
        if: always()
        run: docker compose --profile demo down
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked history for secrets
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.2 git /repo --redact --no-banner
