name: bnpb-m1

services:
  ingest-test:
    profiles: [test]
    build:
      context: ./services/aggregator
      target: integration-test
    env_file: ./env/aggregator.env
    environment:
      AGGREGATOR_DB_TEST: '1'
    depends_on:
      canonical-db:
        condition: service_healthy
    networks: [store_net]

  aggregator:
    build: ./services/aggregator
    env_file: ./env/aggregator.env
    depends_on:
      canonical-db:
        condition: service_healthy
    networks: [source_net, store_net, edge_net, bus_net]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9000/ready']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  dashboard-updater:
    build: ./services/dashboard-updater
    ports: ['127.0.0.1:8091:8091']
    volumes: [dashboard-data:/data]
    networks: [bus_net, consumer_net]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8091/ready']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  notifier:
    build: ./services/notifier
    ports: ['127.0.0.1:8092:8092']
    volumes: [notifier-data:/data]
    networks: [bus_net, consumer_net]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8092/ready']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  pemda-portal:
    profiles: [demo]
    build: ./services/pemda-portal
    ports: ['127.0.0.1:8093:8093']
    volumes: [pemda-data:/data]
    networks: [bus_net, consumer_net]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8093/ready']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  canonical-db:
    image: postgres:16.8-alpine
    env_file: ./env/postgres.env
    volumes:
      - canonical-data:/var/lib/postgresql/data
    networks: [store_net]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  auth-store:
    image: redis:7.4.2-alpine
    env_file: ./env/redis.env
    command: [sh, -ec, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - auth-data:/data
    networks: [auth_net]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [bus_net]
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, kafka:9092, --list]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [/bin/sh, /config/init-topics.sh]
    volumes:
      - ./infra/kafka/init-topics.sh:/config/init-topics.sh:ro
    networks: [bus_net]
    restart: 'no'

  bmkg-mock:
    build: ./services/bmkg-mock
    env_file: ./env/bmkg-mock.env
    ports: ['127.0.0.1:8081:8081']
    networks: [source_net]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8081/health']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  pvmbg-mock:
    build: ./services/pvmbg-mock
    env_file: ./env/pvmbg-mock.env
    ports: ['127.0.0.1:8082:8082']
    networks: [source_net]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8082/health']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  auth-service:
    build: ./services/auth-service
    # Match the owner of mode-0600 bind-mounted secrets on Linux.
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    env_file: ./env/auth-service.env
    ports: ['127.0.0.1:8090:8090']
    volumes:
      - ./env/keys/jwt-private.pem:/run/keys/jwt-private.pem:ro
      - ./env/clients.json:/run/config/clients.json:ro
    depends_on:
      auth-store:
        condition: service_healthy
    networks: [auth_net]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8090/ready']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  client-api:
    build: ./services/client-api
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    env_file: ./env/client-api.env
    ports: ['127.0.0.1:8080:8080']
    volumes:
      - ./env/keys/jwt-public.pem:/run/keys/jwt-public.pem:ro
    networks: [edge_net]
    # Liveness only: Aggregator readiness belongs to the next milestone step.
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/health']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

networks:
  source_net:
  store_net:
    internal: true
  auth_net:
  edge_net:
  # Non-internal network enables loopback port publishing on Docker Desktop.
  consumer_net:
  bus_net:
    internal: true

volumes:
  canonical-data:
  auth-data:
  kafka-data:
  dashboard-data:
  notifier-data:
  pemda-data:
